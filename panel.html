
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resend</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main>
  <aside id="side">
    <div class="row pad">
      <input id="filter" type="search" placeholder="Filter" aria-label="Filter requests" spellcheck="false">
      <button id="clear" class="secondary" type="button">Clear</button>
    </div>
    <label class="check pad"><input type="checkbox" id="hideStatic" checked> Hide static files</label>
    <ul id="list"></ul>
    <p id="empty" class="pad muted">No requests yet. Reload the page or trigger an action.</p>
  </aside>

  <section id="work">
    <div class="bar">
      <label class="switch">
        <span>Request</span>
        <input type="checkbox" id="viewToggle" role="switch" aria-label="Show response">
        <span>Response</span>
      </label>
      <div class="row">
        <div class="msel">
          <button id="methodBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Method"></button>
          <ul id="methodList" role="listbox" aria-label="Method" hidden></ul>
        </div>
        <select id="method" hidden>
          <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option>
          <option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
        </select>
        <input id="url" aria-label="URL (without query string)" placeholder="https://…" spellcheck="false">
        <button id="run" type="button" disabled>Send</button>
        <button id="copy" type="button" class="secondary" disabled>Copy fetch</button>
      </div>
      <p id="msg" role="status"></p>
    </div>

    <div id="reqView" class="view">
      <div class="row">
        <span class="muted">Show:</span>
        <label class="check"><input type="checkbox" id="showHeaders" checked> Headers</label>
        <label class="check"><input type="checkbox" id="showOther" checked> Options</label>
      </div>

      <label for="params">Query params</label>
      <textarea id="params" data-min="2" spellcheck="false"></textarea>

      <div id="headersBox" class="view">
        <label for="headers">Headers</label>
        <textarea id="headers" data-min="4" spellcheck="false"></textarea>
      </div>

      <div class="row">
        <label for="bodyKind">Body</label>
        <select id="bodyKind">
          <option value="none">None</option>
          <option value="json">JSON</option>
          <option value="form">Form</option>
          <option value="raw">Text</option>
        </select>
        <span class="spacer"></span>
        <button id="format" class="secondary" type="button" title="Alt+Shift+F">Format JSON</button>
      </div>
      <textarea id="body" data-min="10" spellcheck="false" aria-label="Body"></textarea>

      <div id="otherBox" class="view">
        <label for="other">Options (JSON)</label>
        <textarea id="other" data-min="3" spellcheck="false"></textarea>
      </div>
    </div>

    <div id="resView" class="view" hidden>
      <div class="row">
        <span class="muted">Show:</span>
        <label class="check"><input type="checkbox" id="showResHeaders" checked> Headers</label>
      </div>

      <div class="row">
        <span id="resStatus" class="status" hidden></span>
        <span id="resMime" class="muted"></span>
      </div>

      <div id="resHeadersBox" class="view">
        <label for="resHeaders">Headers</label>
        <textarea id="resHeaders" data-min="4" readonly spellcheck="false"></textarea>
      </div>

      <label for="resBody">Body</label>
      <textarea id="resBody" data-min="10" readonly spellcheck="false"></textarea>
    </div>
  </section>
</main>
<script src="panel.js"></script>
</body>
</html>
